const rose=$('#roseStack'),outer=$('#outer'),mid=$('#mid'),inner=$('#inner'),canvas=$('#ripple'),ctx=canvas.getContext('2d');let speaking=false,listening=false,ripples=[],raf=0;function resize(){const r=canvas.getBoundingClientRect(),d=Math.max(1,devicePixelRatio||1);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);function addRipple(level=.4){const r=canvas.getBoundingClientRect();ripples.push({x:r.width/2,y:r.height*.45,r:4,max:38+level*105,a:.62,s:.7+level*1.9,l:level});if(!raf)draw()}function draw(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);for(let i=ripples.length-1;i>=0;i--){let p=ripples[i];p.r+=p.s;let q=p.r/p.max;p.a=Math.max(0,.62*(1-q));ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.strokeStyle=`rgba(80,165,255,${p.a})`;ctx.lineWidth=1.2+p.l*2;ctx.stroke();if(q>=1)ripples.splice(i,1)}raf=ripples.length?requestAnimationFrame(draw):0}function setSpeaking(v){speaking=!!v;rose.classList.toggle('speaking',speaking);if(!speaking){outer.style.transform=mid.style.transform=inner.style.transform=''}}function setListening(v){listening=!!v;rose.classList.toggle('listening',listening);$('#mic').classList.toggle('listening',listening)}function audioLevel(l){l=Math.max(0,Math.min(2.5,l||0));if(!speaking)return;outer.style.transform=`scale(${1.02+l*.02})`;mid.style.transform=`scale(${1+l*.035})`;inner.style.transform=`scale(${.88+l*.06})`;addRipple(l*2)}window.Nyxthea={addRipple,setSpeaking,setListening,onAudioLevel:audioLevel};

function unlock(){panel('Unlock your session','<p>Your private Nyxthea data stays locked until this local-development session is authorized.</p><input id="token" class="field" type="password" placeholder="Local development bootstrap token"><button id="doUnlock" class="primary">Unlock local session</button><p id="note" class="small"></p>');$('#doUnlock').onclick=async()=>{try{const d=await api('/api/auth/bootstrap',{method:'POST',body:JSON.stringify({token:$('#token').value})});credential=d.credential;localStorage.setItem('nyxtheaCredential',JSON.stringify(credential));$('#note').textContent='Session unlocked.';setTimeout(shut,500)}catch(e){$('#note').textContent=e.message}}}$('#unlock').onclick=unlock;

let rec=null;$('#mic').onclick=()=>{const SR=SpeechRecognition||webkitSpeechRecognition;if(!SR){panel('Voice input','<p>Voice recognition is not available in this browser.</p>');return}if(rec){rec.stop();return}rec=new SR();rec.lang='en-US';rec.onstart=()=>setListening(true);rec.onend=()=>{setListening(false);rec=null};rec.onerror=()=>{setListening(false);rec=null};rec.onresult=e=>{const m=e.results[0][0].transcript;$('#input').value=m;send(m)};rec.start()};
