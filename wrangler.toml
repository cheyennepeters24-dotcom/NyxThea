name = "nyxthea"
main = "_worker.js"
compatibility_date = "2026-09-18"
assets = { directory = "./public", binding = "ASSETS" }

[vars]
ALEXA_OAUTH_CLIENT_ID = "nyxthea-alexa"
ALEXA_REDIRECT_URIS = "https://pitangui.amazon.com/api/skill/link/M36KJYINIV5UBM,https://alexa.amazon.co.jp/api/skill/link/M36KJYINIV5UBM,https://layla.amazon.com/api/skill/link/M36KJYINIV5UBM"


[[durable_objects.bindings]]
name = "NYXTHEA_STATE"
class_name = "NyxtheaState"

[exports.NyxtheaState]
type = "durable-object"
storage = "sqlite"

[ai]
binding = "AI"

# Keep this Worker custom-domain binding managed by Cloudflare; do not replace it with a manual A/AAAA record.
[[routes]]
pattern = "nyxthea.thecrimsonbluerose.com"
custom_domain = true
