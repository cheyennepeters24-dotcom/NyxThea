name = "nyxthea"
main = "_worker.js"
compatibility_date = "2026-09-18"
assets = { directory = "./public", binding = "ASSETS" }

[vars]
ALEXA_OAUTH_CLIENT_ID = "nyxthea-alexa"
ALEXA_REDIRECT_URIS = "https://alexa.amazon.co.jp/api/skill/link/M3C73GANFMTL0I,https://layla.amazon.com/api/skill/link/M3C73GANFMTL0I,https://pitangui.amazon.com/api/skill/link/M3C73GANFMTL0I"

[[durable_objects.bindings]]
name = "NYXTHEA_STATE"
class_name = "NyxtheaState"

[exports.NyxtheaState]
type = "durable-object"
storage = "sqlite"

[ai]
binding = "AI"
