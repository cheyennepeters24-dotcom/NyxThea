name: Nyxthea checks

on:
  pull_request:
  push:
    branches:
      - main
      - "nyxthea/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: nyxthea-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
      - name: Check Worker syntax
        run: npm run check
      - name: Check interface syntax
        run: npm run check:ui
